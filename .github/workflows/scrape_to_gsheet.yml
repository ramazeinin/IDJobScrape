name: Scrape Jobs and Sync to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install wreq

      - name: Run Glints Scraper
        run: |
          python glints_scraper.py

      - name: Run JobStreet Scraper
        run: |
          python jobstreet_scraper.py

      - name: Prepare Glints Payload
        id: prepare_glints_payload
        run: |
          jq -c '[
            {
              command: "updateData",
              args: {
                worksheetTitle: "Glints",
                minRow: 1,
                minCol: 1,
                data: .
              }
            }
          ]' gsheet_data.json > glints_commands.json

          echo "commands<<EOF" >> $GITHUB_OUTPUT
          cat glints_commands.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Glints Sheet
        uses: jroehl/gsheet.action@v2.1.1
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: ${{ steps.prepare_glints_payload.outputs.commands }}
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}

      - name: Prepare JobStreet Payload
        id: prepare_jobstreet_payload
        run: |
          jq -c '[
            {
              command: "updateData",
              args: {
                worksheetTitle: "Jobstreet",
                minRow: 1,
                minCol: 1,
                data: .
              }
            }
          ]' gsheet_jobstreet_data.json > jobstreet_commands.json

          echo "commands<<EOF" >> $GITHUB_OUTPUT
          cat jobstreet_commands.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update JobStreet Sheet
        uses: jroehl/gsheet.action@v2.1.1
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: ${{ steps.prepare_jobstreet_payload.outputs.commands }}
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}