name: Scrape Jobs and Sync to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install wreq

      - name: Run Scraper
        run: |
          python main.py

      - name: Prepare GSheet Command Payload
        id: prepare_payload
        run: |
          jq -c '[
            {
              command: "updateData",
              args: {
                worksheetTitle: "All_Jobs",
                minRow: 1,
                minCol: 1,
                data: .
              }
            }
          ]' gsheet_data.json > commands.json

          echo "commands<<EOF" >> $GITHUB_OUTPUT
          cat commands.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Google Sheet
        uses: jroehl/gsheet.action@v2.1.1
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: ${{ steps.prepare_payload.outputs.commands }}
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}