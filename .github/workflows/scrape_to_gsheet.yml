name: Scrape Jobs and Sync to Google Sheets

on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 0 * * *' # Optional: Run daily at midnight UTC

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install wreq

      - name: Run Scraper
        run: |
          python main.py

      - name: Prepare GSheet Command Payload
        id: prepare_payload
        run: |
          # Read the matrix generated by the script and wrap it inside the command JSON
          jq -c '{
            commands: [
              {
                command: "appendData",
                args: {
                  worksheetTitle: "Sheet1",
                  minRow: 1,
                  minCol: 1,
                  data: .
                }
              }
            ]
          }' gsheet_data.json > gsheet_commands.json

      - name: Append Google Sheet
        uses: jroehl/gsheet.action@v2.1.1
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: ${{ steps.prepare_payload.outputs.commands }}
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}